name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # gotk4 needs GLib 2.88, newer than the one of the runner
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      # git before checkout: without it, checkout downloads a tarball, and
      # go build cannot stamp the version
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make gcc libc6-dev pkg-config \
            libgtk-4-dev libgirepository1.0-dev
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make install-tools
      - run: make all

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make it
