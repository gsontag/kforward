name: Release

on:
  push:
    tags: ["v*"]

permissions:
  # To create the release and upload its files
  contents: write

jobs:
  release:
    # Built on the oldest Ubuntu supported, the binary runs on the newer
    # systems: glibc and GTK keep their old symbols
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The history and the tags: the version comes from git describe
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install the GTK headers, and Broadway for the widget tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libgtk-4-bin
      - run: make install-tools
      # A tag is not a push to main: CI has not run on it
      - run: make all dist
      # gh is GitHub's own CLI, installed on the runners: no third-party action
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes out/*.tar.gz out/*.tar.gz.sha256